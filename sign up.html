        <center>

                    <input type="checkbox"><i><b>CSS <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSE-bwx6R5tgBPz3VbaPXx-JNxmU974n24UqIvZ19mpJA&s=10" width="50"></b></i><br><br>

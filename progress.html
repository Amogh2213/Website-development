<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

  </body>
</html>
<body class="bg-light">

  <div class="container my-5">
    <!-- Jumbotron Header -->
    <div class="p-5 mb-4 bg-dark text-white rounded-3 shadow">
      <div class="container-fluid py-3">
        <h1 class="display-5 fw-bold">My Study Progress Dashboard</h1>
        <p class="col-md-8 fs-4 text-secondary">Track your learning journey, view lesson counts, and monitor your subject progress in real-time.</p>
        <button class="btn btn-primary btn-lg" type="button">View Study Schedule</button>
      </div>
    </div>

    <!-- Subject Buttons & Lesson Counts (Badges) -->
    <div class="row g-3 mb-5">
      <div class="col-md-12">
        <h3 class="mb-3 text-secondary">Active Subjects</h3>
        <div class="d-flex flex-wrap gap-2">
          
          <button type="button" class="btn btn-outline-primary d-flex align-items-center">
            HTML & CSS <span class="badge bg-primary ms-2">12 Lessons</span>
          </button>

          <button type="button" class="btn btn-outline-success d-flex align-items-center">
            Bootstrap <span class="badge bg-success ms-2">8 Lessons</span>
          </button>

          <button type="button" class="btn btn-outline-warning d-flex align-items-center text-dark">
            Java Script <span class="badge bg-warning text-dark ms-2">24 Lessons</span>
          </button>

          <button type="button" class="btn btn-outline-info d-flex align-items-center text-dark">
            Blue J <span class="badge bg-info text-dark ms-2">18 Lessons</span>
          </button>

          <button type="button" class="btn btn-outline-danger d-flex align-items-center">
            Data Structures <span class="badge bg-danger ms-2">15 Lessons</span>
          </button>

        </div>
      </div>
    </div>

    <!-- Learning Progress Bars -->
    <div class="row">
      <div class="col-md-8">
        <h3 class="mb-4 text-secondary">Learning Progress</h3>

        <!-- Progress Item 1 -->
        <div class="mb-4">
          <div class="d-flex justify-content-between mb-1">
            <span class="fw-semibold">HTML & CSS </span>
            <span class="text-muted">90%</span>
          </div>
          <div class="progress" role="progressbar" aria-label="HTML/CSS Progress" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" style="height: 20px;">
            <div class="progress-bar bg-secondary  progress-bar-striped progress-bar-animated" style="width: 90%"></div>
          </div>
        </div>

        <!-- Progress Item 2 -->
        <div class="mb-4">
          <div class="d-flex justify-content-between mb-1">
            <span class="fw-semibold">Bootstrap </span>
            <span class="text-muted">45%</span>
          </div>
          <div class="progress" role="progressbar" aria-label="Bootstrap Progress" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" style="height: 20px;">
            <div class="progress-bar bg-primary" style="width: 45%"></div>
          </div>
        </div>

        <!-- Progress Item 3 -->
        <div class="mb-4">
          <div class="d-flex justify-content-between mb-1">
            <span class="fw-semibold">Java Script </span>
            <span class="text-muted">60%</span>
          </div>
          <div class="progress" role="progressbar" aria-label="JavaScript Progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="height: 20px;">
            <div class="progress-bar bg-warning" style="width: 60%"></div>
          </div>
        </div>

        <!-- Progress Item 4 -->
        <div class="mb-4">
          <div class="d-flex justify-content-between mb-1">
            <span class="fw-semibold">Blue J</span>
            <span class="text-muted">15%</span>
          </div>
          <div class="progress" role="progressbar" aria-label="React Progress" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100" style="height: 20px;">
            <div class="progress-bar bg-danger" style="width: 15%"></div>
          </div>
        </div>
         <div class="mb-4">
          <div class="d-flex justify-content-between mb-1">
            <span class="fw-semibold">Data Structures</span>
            <span class="text-muted">90%</span>
          </div>
          <div class="progress" role="progressbar" aria-label="HTML/CSS Progress" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" style="height: 20px;">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 90%"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://jsdelivr.net" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
